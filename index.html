<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小涵下载交流 · 登录</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/icons.js"></script>
</head>
<body>
  <div class="auth-wrap">
    <!-- 左侧品牌展示 -->
    <div class="auth-side">
      <div class="auth-side-content">
        <div class="auth-side-logo" data-icon="logo"></div>
        <h1>欢迎回到<br><span style="background:linear-gradient(90deg,#fff,#a5f3fc);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;">小涵下载交流</span></h1>
        <p>下载官方工具、参与社区交流、每日签到领金币兑换好礼。你的小涵之旅，从这里继续。</p>
        <div class="auth-side-features">
          <div class="feat"><span data-icon="download"></span>海量官方工具，一键下载</div>
          <div class="feat"><span data-icon="message"></span>活跃社区，实时互动交流</div>
          <div class="feat"><span data-icon="gift"></span>每日签到，金币兑换好礼</div>
        </div>
      </div>
    </div>

    <!-- 右侧表单 -->
    <div class="auth-form-side page-enter">
      <div class="auth-inner">
        <h2>登录账号</h2>
        <p class="sub">输入你的账号信息以继续</p>
        <div id="alert"></div>
        <form id="loginForm" novalidate>
          <div class="form-group">
            <label>用户名</label>
            <div class="input-wrap">
              <span data-icon="user"></span>
              <input class="input" type="text" id="username" placeholder="请输入用户名" required autocomplete="username" autofocus>
            </div>
            <div class="field-hint" id="usernameHint"></div>
          </div>
          <div class="form-group">
            <label>密码</label>
            <div class="input-wrap has-toggle">
              <span data-icon="lock"></span>
              <input class="input" type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
              <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="切换密码可见">
                <svg id="pwdEye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="field-hint" id="passwordHint"></div>
          </div>
          <div class="form-row-between">
            <label class="form-check"><input type="checkbox" id="rememberMe"><span>记住我</span></label>
            <span style="font-size:13px;color:var(--text-3);">忘记密码？联系管理员</span>
          </div>
          <button type="submit" class="btn btn-block btn-lg" id="loginBtn"><span data-icon="logout"></span>登 录</button>
        </form>
        <div class="auth-divider">还没有账号？</div>
        <div class="auth-switch"><a href="/register">立即注册 <span data-icon="chevronRight" style="display:inline-flex;vertical-align:middle"></span></a></div>
      </div>
    </div>
  </div>

  <script>
    renderIcons();
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alert');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');

    // 记住我：预填用户名
    const saved = localStorage.getItem('xh_remember');
    if (saved) { usernameInput.value = saved; document.getElementById('rememberMe').checked = true; }

    // 密码可见切换
    const pwdToggle = document.getElementById('pwdToggle');
    const pwdEye = document.getElementById('pwdEye');
    pwdToggle.addEventListener('click', () => {
      const isPwd = passwordInput.type === 'password';
      passwordInput.type = isPwd ? 'text' : 'password';
      pwdEye.innerHTML = isPwd
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    });

    function showAlert(msg, type = 'error') {
      const icon = type === 'error' ? 'info' : 'check';
      alertBox.innerHTML = `<div class="alert alert-${type}"><span data-icon="${icon}"></span><span>${msg}</span></div>`;
      renderIcons();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      if (!username) return showAlert('请输入用户名');
      if (!password) return showAlert('请输入密码');
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="loader"></span> 登录中...';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          if (document.getElementById('rememberMe').checked) localStorage.setItem('xh_remember', username);
          else localStorage.removeItem('xh_remember');
          showAlert('登录成功，正在跳转...', 'success');
          // 管理员跳后台，普通用户跳社区
          const target = data.user && data.user.isAdmin ? '/admin' : '/community';
          setTimeout(() => location.href = target, 600);
        } else {
          showAlert(data.error || '登录失败');
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<span data-icon="logout"></span> 登 录';
          renderIcons();
        }
      } catch (err) {
        showAlert('网络错误，请稍后重试');
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<span data-icon="logout"></span> 登 录';
        renderIcons();
      }
    });
  </script>
</body>
</html>
