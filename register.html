<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小涵下载交流 · 注册</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/icons.js"></script>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-side">
      <div class="auth-side-content">
        <div class="auth-side-logo" data-icon="logo"></div>
        <h1>加入<br><span style="background:linear-gradient(90deg,#fff,#a5f3fc);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;">小涵社区</span></h1>
        <p>创建账号，下载官方工具、参与社区交流、每日签到领金币兑换好礼，开启你的小涵之旅。</p>
        <div class="auth-side-features">
          <div class="feat"><span data-icon="zap"></span>3 秒注册，永久免费使用</div>
          <div class="feat"><span data-icon="gift"></span>注册即送金币，签到再领</div>
          <div class="feat"><span data-icon="crown"></span>VIP 会员尊享金色昵称</div>
        </div>
      </div>
    </div>

    <div class="auth-form-side page-enter">
      <div class="auth-inner">
        <h2>创建账号</h2>
        <p class="sub">填写以下信息完成注册</p>
        <div id="alert"></div>
        <form id="registerForm" novalidate>
          <div class="form-group">
            <label>用户名</label>
            <div class="input-wrap">
              <span data-icon="user"></span>
              <input class="input" type="text" id="username" placeholder="3-20 个字符" required minlength="3" maxlength="20" autocomplete="username" autofocus>
            </div>
            <div class="field-hint" id="usernameHint"></div>
          </div>
          <div class="form-group">
            <label>密码</label>
            <div class="input-wrap has-toggle">
              <span data-icon="lock"></span>
              <input class="input" type="password" id="password" placeholder="至少 6 位" required minlength="6" autocomplete="new-password">
              <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="切换密码可见">
                <svg id="pwdEye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="pwd-strength" id="pwdStrength" style="display:none;">
              <div class="pwd-strength-bars" id="pwdBars">
                <span class="s1"></span><span class="s2"></span><span class="s3"></span><span class="s4"></span>
              </div>
              <div class="pwd-strength-label" id="pwdStrengthLabel"></div>
            </div>
          </div>
          <div class="form-group">
            <label>确认密码</label>
            <div class="input-wrap has-toggle">
              <span data-icon="lock"></span>
              <input class="input" type="password" id="password2" placeholder="再次输入密码" required autocomplete="new-password">
              <button type="button" class="pwd-toggle" id="pwdToggle2" aria-label="切换密码可见">
                <svg id="pwdEye2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="field-hint" id="password2Hint"></div>
          </div>
          <button type="submit" class="btn btn-block btn-lg" id="registerBtn"><span data-icon="plus"></span>注 册</button>
        </form>
        <div class="auth-divider">已有账号？</div>
        <div class="auth-switch"><a href="/login">去登录 <span data-icon="chevronRight" style="display:inline-flex;vertical-align:middle"></span></a></div>
      </div>
    </div>
  </div>

  <script>
    renderIcons();
    const form = document.getElementById('registerForm');
    const alertBox = document.getElementById('alert');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const password2Input = document.getElementById('password2');
    const usernameHint = document.getElementById('usernameHint');
    const password2Hint = document.getElementById('password2Hint');
    const pwdStrengthBox = document.getElementById('pwdStrength');
    const pwdBars = document.getElementById('pwdBars');
    const pwdStrengthLabel = document.getElementById('pwdStrengthLabel');
    const registerBtn = document.getElementById('registerBtn');

    // 两个密码框可见切换
    function bindToggle(toggleId, eyeId, inputId) {
      document.getElementById(toggleId).addEventListener('click', () => {
        const inp = document.getElementById(inputId);
        const eye = document.getElementById(eyeId);
        const isPwd = inp.type === 'password';
        inp.type = isPwd ? 'text' : 'password';
        eye.innerHTML = isPwd
          ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
          : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      });
    }
    bindToggle('pwdToggle', 'pwdEye', 'password');
    bindToggle('pwdToggle2', 'pwdEye2', 'password2');

    // 用户名实时校验
    let unameTimer;
    usernameInput.addEventListener('input', () => {
      const v = usernameInput.value.trim();
      clearTimeout(unameTimer);
      if (!v) { usernameHint.textContent = ''; usernameHint.className = 'field-hint'; return; }
      if (v.length < 3 || v.length > 20) {
        usernameHint.textContent = '用户名长度需在 3-20 之间';
        usernameHint.className = 'field-hint err';
        return;
      }
      usernameHint.textContent = '检查中...';
      usernameHint.className = 'field-hint';
      unameTimer = setTimeout(async () => {
        try {
          const res = await fetch('/api/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: v, password: 'check-only' }) });
          const data = await res.json();
          if (data.error === '用户名已被注册') {
            usernameHint.textContent = '该用户名已被注册';
            usernameHint.className = 'field-hint err';
          } else {
            usernameHint.textContent = '用户名可用';
            usernameHint.className = 'field-hint ok';
          }
        } catch (e) { usernameHint.textContent = ''; }
      }, 400);
    });

    // 密码强度检测
    function calcStrength(pwd) {
      let score = 0;
      if (pwd.length >= 6) score++;
      if (pwd.length >= 10) score++;
      if (/[a-z]/.test(pwd) && /[A-Z]/.test(pwd)) score++;
      if (/\d/.test(pwd) && /[^a-zA-Z0-9]/.test(pwd)) score++;
      return Math.min(4, score);
    }
    passwordInput.addEventListener('input', () => {
      const v = passwordInput.value;
      if (!v) { pwdStrengthBox.style.display = 'none'; return; }
      pwdStrengthBox.style.display = 'block';
      const s = calcStrength(v);
      pwdBars.className = 'pwd-strength-bars s' + s;
      const labels = ['', '弱', '一般', '中等', '强'];
      pwdStrengthLabel.textContent = '密码强度：' + labels[s];
    });

    // 确认密码
    password2Input.addEventListener('input', () => {
      const v = password2Input.value;
      if (!v) { password2Hint.textContent = ''; password2Hint.className = 'field-hint'; return; }
      if (v !== passwordInput.value) {
        password2Hint.textContent = '两次密码不一致';
        password2Hint.className = 'field-hint err';
      } else {
        password2Hint.textContent = '密码一致';
        password2Hint.className = 'field-hint ok';
      }
    });

    function showAlert(msg, type = 'error') {
      const icon = type === 'error' ? 'info' : 'check';
      alertBox.innerHTML = `<div class="alert alert-${type}"><span data-icon="${icon}"></span><span>${msg}</span></div>`;
      renderIcons();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      const password2 = password2Input.value;
      if (!username || username.length < 3) return showAlert('用户名至少 3 个字符');
      if (!password || password.length < 6) return showAlert('密码至少 6 位');
      if (password !== password2) return showAlert('两次密码不一致');
      registerBtn.disabled = true;
      registerBtn.innerHTML = '<span class="loader"></span> 注册中...';
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          showAlert('注册成功，正在跳转...', 'success');
          setTimeout(() => location.href = '/community', 600);
        } else {
          showAlert(data.error || '注册失败');
          registerBtn.disabled = false;
          registerBtn.innerHTML = '<span data-icon="plus"></span> 注 册';
          renderIcons();
        }
      } catch (err) {
        showAlert('网络错误，请稍后重试');
        registerBtn.disabled = false;
        registerBtn.innerHTML = '<span data-icon="plus"></span> 注 册';
        renderIcons();
      }
    });
  </script>
</body>
</html>
